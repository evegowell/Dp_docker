services:
  diffusion_policy:
    build: .
    image: diffusion-policy-dev:latest
    container_name: diffusion_policy_dev
    working_dir: /workspace/diffusion_policy
    volumes:
      - ./diffusion_policy:/workspace/diffusion_policy
      - conda_envs:/opt/conda/envs
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true

volumes:
  conda_envs:
